<html lang="ru">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">

<title>Трекер</title>
<style>
:root{--card:#141416;--card2:#1C1C1E;--line:rgba(255,255,255,.07);--mut:#A1A1AA;--green:#34D399;--pink:#FF4D6D;--gold:#FFC53D;--violet:#A78BFA;--orange:#FB923C;--blue:#60A5FA;--cyan:#22D3EE;--amber:#FBBF24;--disp:Unbounded,Inter,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select,textarea{font-family:inherit;font-size:16px;color:#fff}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 112px);display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px 4px}
.h1{margin:0;font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:-.5px}
.sub{font-size:14px;color:var(--mut)}
.mut{color:var(--mut)}
.disp{font-family:var(--disp)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px}
.ctitle{font-family:var(--disp);font-size:16px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rbtn{width:48px;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.rbtn.fill{border:none;color:#000}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:16px;min-height:168px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;width:100%}
.big{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.bar{height:6px;border-radius:3px;background:#2A2A2E;overflow:hidden}.bar>i{display:block;height:100%;border-radius:3px}
.sec{font-family:var(--disp);font-size:18px;font-weight:600;padding:6px 4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:999px;padding:7px 12px;background:var(--card2);color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:54px;border-radius:27px;border:none;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 18px}
.btn.pri{background:var(--green);color:#000}
.btn.white{background:#fff;color:#000}
.btn.ghost{background:var(--card2);border:1px solid rgba(255,255,255,.12);color:#fff}
.btn.danger{background:transparent;border:1px solid rgba(255,77,109,.45);color:#FF8FA3}
.btn:disabled{opacity:.5}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:calc(100% - 32px);max-width:448px;height:68px;border-radius:34px;background:rgba(28,28,30,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:20}
.nav button{width:52px;height:52px;border-radius:26px;border:none;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;padding:0}
.ring{position:relative;flex-shrink:0}.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.strip{display:flex;justify-content:space-between;gap:6px}
.day{flex:1;max-width:48px;height:66px;border-radius:23px;border:1px solid rgba(255,255,255,.08);background:var(--card);color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;position:relative}
.day b{font-size:17px;color:#E4E4E7}.day span{font-size:12px}
.day.on{background:var(--green);border-color:var(--green);color:#000}.day.on b{color:#000}
.day.has::after{content:'';position:absolute;bottom:7px;width:4px;height:4px;border-radius:2px;background:var(--green)}
.day.on.has::after{background:#000}
.day.fut{opacity:.45}
.meal{padding:12px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:none}
.fi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 0;background:none;border:none;text-align:left}
.fi .n{font-size:15px}.fi .g{font-size:12px;color:var(--mut);margin-top:2px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 7px;border:1px solid rgba(255,255,255,.2);color:var(--mut)}
.add-s{height:40px;border-radius:20px;border:1px solid rgba(52,211,153,.4);background:transparent;color:var(--green);font-size:14px;font-weight:600;padding:0 14px;display:flex;align-items:center;gap:6px}
.hb{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.hb.off{opacity:.55}
.hrow{display:flex;align-items:center;gap:12px}
.hico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.htxt{display:flex;flex-direction:column;gap:3px;flex-grow:1;min-width:0;background:none;border:none;text-align:left;padding:4px 0}
.htxt b{font-size:15px;font-weight:600}.htxt span{font-size:12px;color:var(--mut)}
.ck{width:44px;height:44px;border-radius:22px;border:2px solid #52525B;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ck.on{border:none;color:#000}
.cnt{width:40px;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.segs{display:grid;gap:5px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:4px}
.heat i{width:13px;height:13px;border-radius:4px;display:block}
.seg{display:flex;background:#0B0B0C;border:1px solid var(--line);border-radius:18px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:14px;border:none;background:transparent;color:var(--mut);font-size:14px;font-weight:600;padding:0 6px}
.seg button.on{background:#2A2A2E;color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#141416;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);z-index:41;animation:up .26s ease-out;display:flex;flex-direction:column;gap:14px}
.handle{width:40px;height:5px;border-radius:3px;background:#3F3F46;margin:0 auto}
.stitle{font-family:var(--disp);font-size:19px;font-weight:600}
.x{width:40px;height:40px;border-radius:20px;border:none;background:var(--card2);display:flex;align-items:center;justify-content:center;padding:0;color:var(--mut);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:13px;color:var(--mut)}
.inp{width:100%;height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:#0B0B0C;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:rgba(255,255,255,.35)}
.inp.huge{height:64px;font-size:28px;font-weight:600;text-align:center}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 2px;background:none;border:none;border-bottom:1px solid var(--line);text-align:left}
.pi .n{font-size:15px}.pi .g{font-size:12px;color:var(--mut);margin-top:2px}
.pi.act{color:var(--green);font-weight:600}
.gchip{height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:transparent;padding:0 14px;font-size:14px;font-weight:600}
.lbl{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.sw{width:40px;height:40px;border-radius:20px;border:3px solid transparent;padding:0}
.sw.on{border-color:#fff}
.icb{width:44px;height:44px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:#0B0B0C;display:flex;align-items:center;justify-content:center;padding:0;color:var(--mut)}
.icb.on{background:#2A2A2E;color:#fff;border-color:rgba(255,255,255,.4)}
.wd{flex:1;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0B0B0C;color:var(--mut);font-size:13px;font-weight:600;padding:0}
.wd.on{background:#2A2A2E;color:#fff;border-color:rgba(255,255,255,.4)}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-160%);transition:transform .3s ease;z-index:80;background:#1C1C1E;border:1px solid rgba(255,197,61,.45);color:var(--gold);font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
#toast.info{color:#fff;border-color:rgba(255,255,255,.2)}
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:24px;animation:fade .2s}
.mbox{width:100%;max-width:340px;background:#141416;border:1px solid rgba(255,197,61,.3);border-radius:32px;padding:26px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.lad{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lad .num{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bdg{background:#0B0B0C;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}
.bdg.no{opacity:.45}
.soon{border:1px dashed rgba(255,255,255,.18);background:transparent}
.err{background:#2A0E15;border:1px solid rgba(255,77,109,.4);color:#FFB3C1;border-radius:16px;padding:12px 14px;font-size:13px}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mut);background:none;border:none;padding:8px;width:100%}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>

var MEALS = ['Завтрак', 'Обед', 'Ужин', 'Перекус'];
var LNAMES = ['Новичок', 'Ученик', 'Боец', 'Охотник', 'Страж', 'Рыцарь', 'Ветеран', 'Мастер', 'Чемпион', 'Легенда'];

function ring(size, stroke, frac, color, track) {
  var c = size / 2, r = (size - stroke) / 2, L = 2 * Math.PI * r, f = clamp(frac || 0, 0, 1);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + (track || '#2A2A2E') + '" stroke-width="' + stroke + '"/>' +
    (f > 0 ? '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + (L * f).toFixed(1) + ' ' + L.toFixed(1) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/>' : '') +
    '</svg>';
}
function bar(frac, color) { return '<div class="bar"><i style="width:' + (clamp(frac, 0, 1) * 100).toFixed(1) + '%;background:' + color + '"></i></div>'; }
function alpha(hex, a) { var h = String(hex || '#FFFFFF').replace('#', ''); if (h.length === 3) h = h.replace(/./g, '$&$&'); var n = parseInt(h, 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

/* ---------- данные: настройки, индексы ---------- */
function st(k, d) { var v = S.settings[k]; return has(v) ? v : d; }
function target() { return num(st('kcal', 1800)) || 1800; }
function corridor() { return num(st('corridor', 100)) || 100; }

function buildIdx() {
  IX = { chk: {}, food: {}, w: {} };
  S.checks.forEach(function (c) { IX.chk[c.date + '|' + c.habit] = num(c.value); });
  S.food.forEach(function (f) { if (!isDate(f.date)) return; (IX.food[f.date] = IX.food[f.date] || []).push(f); });
  S.weights.forEach(function (w) { if (isDate(w.date) && num(w.weight) > 0) IX.w[w.date] = w; });
}
function habits() {
  return S.habits.filter(function (h) { return has(h.id) && lc(h.active) !== 'нет'; })
    .sort(function (a, b) { return num(a.order) - num(b.order); });
}
function allHabits() { return S.habits.filter(function (h) { return has(h.id); }); }
function inRange(h, d) {
  if (lc(h.active) === 'нет' && !isDate(h.ended)) return false;
  if (isDate(h.created) && d < h.created) return false;
  if (isDate(h.ended) && d >= h.ended) return false;
  return true;
}
function sched(h, d) { if (!inRange(h, d)) return false; var days = lc(h.days); if (!days) return true; return days.split(/[\s,;]+/).indexOf(WDL[wd(d)]) >= 0; }
function hv(h, d) { return IX.chk[d + '|' + h.id] || 0; }
function hGoal(h) { return h.type === 'count' ? Math.max(1, num(h.goal) || 1) : (h.type === 'food' ? Math.max(1, num(h.goal) || 3) : 1); }
function hAuto(h, d) {
  if (h.type === 'weight') return !!IX.w[d];
  if (h.type === 'food') return (IX.food[d] || []).length >= hGoal(h);
  return false;
}
function hDone(h, d) { if (h.type === 'count') return hv(h, d) >= hGoal(h); return hAuto(h, d) || hv(h, d) > 0; }
function dayTot(d) {
  var t = { kcal: 0, p: 0, f: 0, c: 0, n: 0 };
  (IX.food[d] || []).forEach(function (f) { t.kcal += num(f.kcal); t.p += num(f.p); t.f += num(f.f); t.c += num(f.c); t.n++; });
  return t;
}
function inCorr(d) { var t = dayTot(d); return t.n > 0 && Math.abs(t.kcal - target()) <= corridor(); }
function sortedWeights() { return S.weights.filter(function (w) { return isDate(w.date) && num(w.weight) > 0; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }); }
function lastVal(field) { var ws = S.weights.filter(function (w) { return isDate(w.date) && has(w[field]); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }); return ws[0] || null; }
function firstDate() {
  var c = [];
  if (isDate(st('startDate', ''))) c.push(String(st('startDate')));
  S.food.forEach(function (f) { c.push(f.date); });
  S.checks.forEach(function (x) { c.push(x.date); });
  S.weights.forEach(function (w) { c.push(w.date); });
  c = c.filter(isDate).sort();
  var t = today();
  return c[0] && c[0] < t ? c[0] : t;
}

/* ---------- очки, уровни, значки ---------- */
function calc() {
  buildIdx();
  var T = today(), first = firstDate(), hs = allHabits();
  var r = { xp: 0, stats: {}, day: {}, checks: 0, corrDays: 0, first: first };
  STATS.forEach(function (s) { r.stats[s[1]] = 0; });
  var d;
  for (d = first; d <= T; d = addD(d, 1)) {
    var dx = 0, sc = 0, dn = 0;
    hs.forEach(function (h) {
      if (!inRange(h, d)) return;
      var isS = sched(h, d), ok = hDone(h, d);
      if (isS) sc++;
      if (ok) {
        if (isS) dn++;
        dx += num(h.xp); r.checks++;
        var k = lc(h.stat); if (r.stats[k] === undefined) k = 'дисциплина';
        r.stats[k] += num(h.xp);
      }
    });
    if (inCorr(d)) { dx += 15; r.stats['баланс'] += 15; r.corrDays++; }
    r.day[d] = { xp: dx, s: sc, d: dn, frac: sc ? dn / sc : 0 };
    r.xp += dx;
  }
  var sw = num(st('startWeight', 0));
  var ws = sortedWeights().map(function (w) { return num(w.weight); });
  var minW = ws.length ? Math.min.apply(null, ws) : 0;
  r.lost = sw && minW ? Math.max(0, sw - minW) : 0;
  var kg = Math.floor(r.lost + 1e-9);
  r.kgXp = kg * 30; r.xp += r.kgXp; r.stats['сила'] += r.kgXp;
  function closed(x) { return x && x.s > 0 && x.d / x.s >= 0.8; }
  var run = 0, best = 0;
  for (d = first; d <= T; d = addD(d, 1)) {
    if (closed(r.day[d])) { run++; best = Math.max(best, run); } else if (d !== T) run = 0;
  }
  var cur = 0; d = T;
  if (!closed(r.day[d])) d = addD(d, -1);
  while (d >= first && closed(r.day[d])) { cur++; d = addD(d, -1); }
  r.streak = cur; r.best = Math.max(best, cur);
  r.today = r.day[T] || { xp: 0, s: 0, d: 0, frac: 0 };
  return r;
}
function lvlInfo(xp) { var n = 1; while (xp >= 75 * n * (n + 1)) n++; var lo = 75 * (n - 1) * n, hi = 75 * n * (n + 1); return { n: n, lo: lo, hi: hi, frac: (xp - lo) / (hi - lo), left: hi - xp }; }
function lname(n) { var L = (S.levels || []).filter(has); return L[n - 1] || LNAMES[n - 1] || ('Уровень ' + n); }
function statLvl(x) { var n = 1; while (x >= 25 * n * (n + 1)) n++; var lo = 25 * (n - 1) * n, hi = 25 * n * (n + 1); return { n: n, frac: (x - lo) / (hi - lo) }; }
function badgeList(r) {
  return [
    { id: 'start', t: 'Первый шаг', d: 'первые очки', ok: r.xp > 0, c: '#FFC53D' },
    { id: 's7', t: 'Неделя огня', d: '7 дней подряд', ok: r.best >= 7, c: '#FF4D6D' },
    { id: 's30', t: 'Месяц силы', d: '30 дней подряд', ok: r.best >= 30, c: '#FF4D6D' },
    { id: 'c7', t: 'В коридоре ×7', d: '7 дней в норме', ok: r.corrDays >= 7, c: '#34D399' },
    { id: 'c30', t: 'В коридоре ×30', d: '30 дней в норме', ok: r.corrDays >= 30, c: '#34D399' },
    { id: 'k1', t: 'Минус 1 кг', d: 'от старта', ok: r.lost >= 1, c: '#F4F4F5' },
    { id: 'k3', t: 'Минус 3 кг', d: 'от старта', ok: r.lost >= 3, c: '#F4F4F5' },
    { id: 'k5', t: 'Минус 5 кг', d: 'от старта', ok: r.lost >= 5, c: '#F4F4F5' },
    { id: 'k10', t: 'Минус 10 кг', d: 'первая цель', ok: r.lost >= 10, c: '#FFC53D' },
    { id: 'h100', t: 'Сотня', d: '100 отметок', ok: r.checks >= 100, c: '#A78BFA' }
  ];
}

/* ---------- синхронизация ---------- */
function saveLocal() { LS.set('tr_cache', S); LS.set('tr_queue', Q); }
function upsertBy(list, item, keyFn) {
  var k = keyFn(item);
  for (var i = 0; i < list.length; i++) {
    if (keyFn(list[i]) === k) {
      var m = Object.assign({}, list[i]);
      Object.keys(item).forEach(function (f) { if (item[f] !== undefined && item[f] !== null) m[f] = item[f]; });
      list[i] = m; return;
    }
  }
  list.push(Object.assign({}, item));
}
function applyOp(s, op) {
  var it = op.item;
  switch (op.op) {
    case 'food.save':
      upsertBy(s.food, it, function (x) { return String(x.id); });
      if (op.isNew) s.products.forEach(function (p) { if (lc(p.name) === lc(it.name)) p.used = num(p.used) + 1; });
      break;
    case 'food.delete': s.food = s.food.filter(function (x) { return String(x.id) !== String(op.id); }); break;
    case 'product.save': upsertBy(s.products, it, function (x) { return lc(x.name); }); break;
    case 'habit.save': upsertBy(s.habits, it, function (x) { return String(x.id); }); break;
    case 'check.set':
      s.checks = s.checks.filter(function (x) { return !(x.date === it.date && String(x.habit) === String(it.habit)); });
      if (num(it.value) > 0) s.checks.push(Object.assign({}, it));
      break;
    case 'weight.save': upsertBy(s.weights, it, function (x) { return String(x.date); }); break;
    case 'weight.delete': s.weights = s.weights.filter(function (x) { return String(x.date) !== String(op.date); }); break;
    case 'settings.save': s.settings = Object.assign({}, s.settings, it); break;
  }
}
function push(op) { applyOp(S, op); Q.push(op); saveLocal(); scheduleSync(700); }
function scheduleSync(ms) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(sync, ms || 500); }
function api(payload) {
  var ctl = new AbortController();
  var tm = setTimeout(function () { ctl.abort(); }, 30000);
  return fetch(conf.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: conf.key }, payload)), signal: ctl.signal, redirect: 'follow' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Сервер ответил не так. Проверь ссылку: она должна заканчиваться на /exec'); }
      if (!j.ok) throw new Error(j.error === 'bad key' ? 'Неверный ключ' : (j.error || 'ошибка сервера'));
      return j;
    })
    .finally(function () { clearTimeout(tm); });
}
function fromServer(j) {
  return {
    settings: j.settings || {}, products: j.products || [], food: (j.food || []).map(function (f) { f.id = String(f.id); return f; }),
    habits: (j.habits || []).map(function (h) { h.id = String(h.id); return h; }), checks: j.checks || [], weights: j.weights || [], levels: j.levels || []
  };
}
function sync() {
  if (!conf.url || !conf.key) return Promise.resolve();
  if (SYNC.busy) { SYNC.again = true; return Promise.resolve(); }
  SYNC.busy = true; renderSync();
  var ops = Q.slice();
  var firstEver = !LS.get('tr_seen', null);
  return api({ action: 'batch', ops: ops, reload: true }).then(function (j) {
    Q = Q.slice(ops.length);
    S = fromServer(j);
    Q.forEach(function (op) { applyOp(S, op); });
    saveLocal();
    SYNC.last = Date.now(); LS.set('tr_last', SYNC.last); SYNC.err = '';
    render();
    checkProgress(firstEver);
  }).catch(function (e) {
    SYNC.err = (e && e.name === 'AbortError') ? 'нет ответа' : ((e && e.message) || 'нет связи');
  }).then(function () {
    SYNC.busy = false; renderSync();
    if (SYNC.again) { SYNC.again = false; scheduleSync(300); }
  });
}
function syncLine() {
  if (!conf.url) return '<button class="sync" data-a="settings">' + ic('sync', 16) + 'Таблица не подключена — подключить</button>';
  var t;
  if (SYNC.busy) t = 'Синхронизация…';
  else if (Q.length) t = 'Ждут отправки: ' + Q.length + (SYNC.err ? ' · ' + esc(SYNC.err) : '');
  else if (SYNC.err) t = 'Не удалось обновить: ' + esc(SYNC.err);
  else if (SYNC.last) { var d = new Date(SYNC.last); t = 'Синхронизировано в ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  else t = 'Ещё не синхронизировано';
  return '<button class="sync" data-a="syncNow">' + ic('sync', 16) + '<span>' + t + '</span></button>';
}
function renderSync() { var el = $('syncbox'); if (el) el.innerHTML = syncLine(); }

/* ---------- всплывашки ---------- */
var toastT = null;
function toast(msg, info) {
  var el = $('toast'); el.textContent = msg; el.className = info ? 'info show' : 'show';
  clearTimeout(toastT); toastT = setTimeout(function () { el.className = info ? 'info' : ''; }, 1900);
}
function modal(html) { $('modal-root').innerHTML = '<div class="modal" data-a="closeModal"><div class="mbox">' + html + '</div></div>'; }
function checkProgress(silent) {
  var r = calc(), L = lvlInfo(r.xp).n;
  var got = badgeList(r).filter(function (b) { return b.ok; });
  var ids = got.map(function (b) { return b.id; });
  var seen = LS.get('tr_seen', null);
  if (!seen || silent) { LS.set('tr_seen', { l: Math.max(L, seen ? seen.l : 0), b: ids }); return; }
  var fresh = got.filter(function (b) { return seen.b.indexOf(b.id) < 0; });
  if (L > seen.l) {
    modal('<div class="ring">' + ring(120, 10, 1, '#FFC53D') + '<div><span class="disp" style="font-size:44px;font-weight:700;color:var(--gold)">' + L + '</span></div></div>' +
      '<div class="lbl" style="color:var(--gold)">Новый уровень</div><div class="disp" style="font-size:24px;font-weight:600">' + esc(lname(L)) + '</div>' +
      '<div class="sub">До следующего — ' + fmt(lvlInfo(r.xp).left) + ' XP</div><button class="btn white" data-a="closeModal" style="margin-top:6px">Вперёд</button>');
  } else if (fresh.length) {
    var b = fresh[0];
    modal('<div class="hico" style="width:84px;height:84px;border-radius:26px;background:' + alpha(b.c, .16) + ';color:' + b.c + '">' + ic('medal', 44) + '</div>' +
      '<div class="lbl" style="color:var(--gold)">Новый значок</div><div class="disp" style="font-size:22px;font-weight:600">' + esc(b.t) + '</div><div class="sub">' + esc(b.d) + '</div>' +
      '<button class="btn white" data-a="closeModal" style="margin-top:6px">Круто</button>');
  }
  LS.set('tr_seen', { l: Math.max(L, seen.l), b: seen.b.concat(fresh.map(function (b) { return b.id; })) });
}
function act(fn) {
  var before = calc().xp;
  fn();
  var after = calc().xp;
  if (after > before) toast('+' + fmt(after - before) + ' XP');
  else if (after < before) toast('−' + fmt(before - after) + ' XP', true);
  render();
  checkProgress(false);
}

/* ---------- экраны ---------- */
function render() {
  var app = $('app');
  if (!conf.url || !conf.key) { app.innerHTML = vConnect(); return; }
  var r = calc(), h;
  if (UI.tab === 'food') h = vFood(r);
  else if (UI.tab === 'habits') h = vHabits(r);
  else if (UI.tab === 'fit') h = vFit(r);
  else if (UI.tab === 'more') h = vMore(r);
  else h = vHome(r);
  app.innerHTML = h + '<div id="syncbox">' + syncLine() + '</div>' + vNav();
}

  }).join('') + '</nav>';
}

    '<div class="field"><label for="c-url">Ссылка</label><input id="c-url" class="inp" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(conf.url) + '"></div>' +

    '<div id="c-err"></div>' +

function vHome(r) {

  var ws = sortedWeights(), lw = ws[ws.length - 1], pw = ws[ws.length - 2];

  var sw = num(st('startWeight', 0)), gw = num(st('goalWeight', 0)), cw = lw ? num(lw.weight) : sw;
  var prog = sw > gw && gw > 0 ? clamp((sw - cw) / (sw - gw), 0, 1) : 0;
  var name = st('name', '');

    '<h1 class="h1">' + (name ? 'Привет, ' + esc(name) : 'Привет') + '</h1></div>' +
    '<button class="rbtn" data-a="settings" aria-label="Настройки">' + ic('gear', 22) + '</button></div>';

  h += '<button class="card" data-a="level" style="display:flex;flex-direction:column;gap:18px;text-align:left;width:100%">' +
    '<div style="display:flex;align-items:center;gap:16px;width:100%"><div class="ring" style="width:84px;height:84px">' + ring(84, 8, L.frac, '#FFC53D') +
    '<div class="disp" style="font-size:28px;font-weight:700;color:var(--gold)">' + L.n + '</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="sub" style="font-size:13px">Уровень ' + L.n + (r.today.xp ? ' · сегодня +' + r.today.xp + ' XP' : '') + '</span>' +
    '<span class="disp" style="font-size:20px;font-weight:600">' + esc(lname(L.n)) + '</span>' +
    '<span class="sub" style="font-size:13px"><b style="color:var(--gold)">' + fmt(r.xp) + '</b> / ' + fmt(L.hi) + ' XP · ещё ' + fmt(L.left) + '</span></div></div>' +
    '<div style="display:flex;flex-direction:column;gap:11px;width:100%"><span class="lbl">Характеристики</span>' +
    STATS.map(function (s) {
      var x = statLvl(r.stats[s[1]] || 0);
      return '<div style="display:grid;grid-template-columns:124px minmax(0,1fr) 24px;align-items:center;gap:10px"><span style="font-size:14px;color:#E4E4E7">' + s[0] + '</span>' + bar(x.frac, s[2]) + '<span class="sub" style="font-size:13px;text-align:right">' + x.n + '</span></div>';
    }).join('') + '</div></button>';

  var left = tg - tot.kcal;
  h += '<div class="grid2">' +
    '<button class="tile" data-a="tab" data-v="food"><span class="sub">Калории</span><div><div class="big">' + fmt(tot.kcal) + '</div><div class="sub" style="font-size:13px;margin-top:2px">из ' + fmt(tg) + ' ккал</div></div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' + bar(tot.kcal / tg, tot.kcal > tg + corridor() ? 'var(--amber)' : 'var(--green)') +

    var d = {};
    ['name', 'height', 'age', 'sex', 'activity', 'startWeight', 'goalWeight', 'kcal', 'corridor', 'protein', 'fat', 'carbs'].forEach(function (k) { d[k] = st(k, ''); });
    d.url = conf.url; d.key = conf.key;
    openSheet('settings', d);
  },
  level: function () { openSheet('level', {}); },
  close: function () { closeSheet(); },
  closeModal: function (el, e) { if (e.target === el || el.tagName === 'BUTTON') $('modal-root').innerHTML = ''; },
  /* рацион */
  week: function (el) { var D = UI.foodDate || today(), n = addD(D, +el.dataset.v); if (n > today()) n = today(); UI.foodDate = n; render(); },
  fday: function (el) { UI.foodDate = el.dataset.v; render(); },
  addFood: function (el) { openSheet('add', { meal: el.dataset.meal || mealNow(), date: UI.foodDate || today(), q: '' }); setTimeout(function () { var i = $('fq'); if (i && !el.dataset.meal) i.focus(); }, 280); },
  sMeal: function (el) { UI.sheet.data.meal = el.dataset.v; renderSheet(); },
  pick: function (el) {
    var p = findProd(el.dataset.v); if (!p) return;
    var d = UI.sheet.data;
    openSheet('grams', { meal: d.meal, date: d.date, name: p.name, per: perOf(p), portion: p.portion, portionName: p.portionName, grams: num(p.portion) > 0 ? num(p.portion) : '' });
    setTimeout(function () { var i = $('fg'); if (i) { i.focus(); i.select(); } }, 280);
  },
  rep: function (el) {
    var f = S.food.filter(function (x) { return String(x.id) === el.dataset.id; })[0]; if (!f) return;
    var d = UI.sheet.data, p = findProd(f.name);
    if (p && num(f.grams) > 0) { openSheet('grams', { meal: d.meal, date: d.date, name: p.name, per: perOf(p), portion: p.portion, portionName: p.portionName, grams: num(f.grams) }); return; }
    var item = { id: uid(), date: d.date, meal: d.meal, name: f.name, grams: f.grams, kcal: num(f.kcal), p: num(f.p), f: num(f.f), c: num(f.c), src: f.src || 'вручную', added: new Date().toISOString() };
    closeSheet(); act(function () { push({ op: 'food.save', item: item, isNew: true }); });
  },
  gset: function (el) { UI.sheet.data.grams = el.dataset.v; $('fg').value = el.dataset.v; $('fres').innerHTML = gramsRes(); },
  saveFood: function () {
    var d = UI.sheet.data, c = gramsCalc(d);
    if (!(c.g > 0)) { toast('Укажи, сколько грамм', true); return; }
    var isNew = !d.editId;
    var item = { id: d.editId || uid(), date: d.date, meal: d.meal, name: d.name, grams: c.g, kcal: c.kcal, p: c.p, f: c.f, c: c.c, src: d.src || 'вручную' };
    if (isNew) item.added = new Date().toISOString();
    UI.foodDate = d.date; closeSheet();
    act(function () { push({ op: 'food.save', item: item, isNew: isNew }); });
  },
  newProd: function () { var d = UI.sheet.data; openSheet('newprod', { meal: d.meal, date: d.date, name: (d.q || '').trim() }); },
  saveProd: function () {
    var d = UI.sheet.data, name = String(d.name || '').trim();
    if (!name) { toast('Напиши название', true); return; }
    if (!(num(d.kcal) > 0)) { toast('Укажи ккал на 100 г', true); return; }
    var p = { name: name, kcal: num(d.kcal), p: num(d.p), f: num(d.f), c: num(d.c), portion: num(d.portion) || '', portionName: String(d.portionName || '').trim(), used: 0 };
    push({ op: 'product.save', item: p });
    openSheet('grams', { meal: d.meal, date: d.date, name: name, per: perOf(p), portion: p.portion, portionName: p.portionName, grams: num(p.portion) > 0 ? num(p.portion) : '' });
  },
  quick: function () { var d = UI.sheet.data; openSheet('quick', { meal: d.meal, date: d.date, name: (d.q || '').trim() }); },
  saveQuick: function () {
    var d = UI.sheet.data;
    if (!(num(d.kcal) > 0)) { toast('Укажи калории', true); return; }
    var isNew = !d.editId;
    var item = { id: d.editId || uid(), date: d.date, meal: d.meal, name: String(d.name || '').trim() || 'Без названия', grams: '', kcal: Math.round(num(d.kcal)), p: num(d.p), f: num(d.f), c: num(d.c), src: 'быстро' };
    if (isNew) item.added = new Date().toISOString();
    UI.foodDate = d.date; closeSheet();
    act(function () { push({ op: 'food.save', item: item, isNew: false }); });
  },
  fEdit: function (el) {
    var f = S.food.filter(function (x) { return String(x.id) === el.dataset.id; })[0]; if (!f) return;
    var g = num(f.grams);
    if (g > 0) {
      var p = findProd(f.name);
      var per = p ? perOf(p) : { kcal: num(f.kcal) / g * 100, p: num(f.p) / g * 100, f: num(f.f) / g * 100, c: num(f.c) / g * 100 };
      openSheet('grams', { editId: String(f.id), meal: f.meal || 'Перекус', date: f.date, name: f.name, per: per, portion: p ? p.portion : '', portionName: p ? p.portionName : '', grams: g, src: f.src });
    } else openSheet('quick', { editId: String(f.id), meal: f.meal || 'Перекус', date: f.date, name: f.name, kcal: f.kcal, p: f.p, f: f.f, c: f.c });
  },
  fDel: function () {
    var id = UI.sheet.data.editId; if (!id || !confirm('Удалить запись?')) return;
    closeSheet(); act(function () { push({ op: 'food.delete', id: id }); });
  },
  /* привычки */
  hDay: function (el) { UI.habitBack = +el.dataset.v; render(); },
  hTog: function (el) {
    var h = habits().filter(function (x) { return x.id === el.dataset.id; })[0]; if (!h) return;
    var D = addD(today(), -UI.habitBack);
    buildIdx();
    if (h.type === 'weight' && !IX.w[D] && !hv(h, D)) { A.wNew(null, null, D); return; }
    if (hAuto(h, D)) { toast(h.type === 'weight' ? 'Засчитано: вес записан' : 'Засчитано автоматически', true); return; }
    var v = hv(h, D) > 0 ? 0 : 1;
    act(function () { push({ op: 'check.set', item: { date: D, habit: h.id, value: v, updated: new Date().toISOString() } }); });
  },
  hCnt: function (el) {
    var h = habits().filter(function (x) { return x.id === el.dataset.id; })[0]; if (!h) return;
    var D = addD(today(), -UI.habitBack);
    buildIdx();
    var v = clamp(hv(h, D) + (+el.dataset.v), 0, hGoal(h) * 3);
    act(function () { push({ op: 'check.set', item: { date: D, habit: h.id, value: v, updated: new Date().toISOString() } }); });
  },
  hNew: function () { openSheet('habit', { type: 'check', goal: '', unit: '', xp: 10, days: [], color: '#FF4D6D', icon: 'star', stat: 'дисциплина', name: '' }); },
  hEdit: function (el) {
    var h = S.habits.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!h) return;
    openSheet('habit', { id: h.id, name: h.name, type: h.type || 'check', goal: h.goal, unit: h.unit, xp: num(h.xp), days: lc(h.days) ? lc(h.days).split(/[\s,;]+/) : [], color: h.color || '#FF4D6D', icon: h.icon || 'star', stat: lc(h.stat) || 'дисциплина', order: h.order });
  },
  hType: function (el) { UI.sheet.data.type = el.dataset.v; if (el.dataset.v === 'count' && !num(UI.sheet.data.goal)) UI.sheet.data.goal = 8; renderSheet(); },
  hXp: function (el) { UI.sheet.data.xp = +el.dataset.v; renderSheet(); },
  hWd: function (el) { var a = UI.sheet.data.days, i = a.indexOf(el.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(el.dataset.v); renderSheet(); },
  hCol: function (el) { UI.sheet.data.color = el.dataset.v; renderSheet(); },
  hIc: function (el) { UI.sheet.data.icon = el.dataset.v; renderSheet(); },
  hStat: function (el) { UI.sheet.data.stat = el.dataset.v; renderSheet(); },
  hSave: function () {
    var d = UI.sheet.data, name = String(d.name || '').trim();
    if (!name) { toast('Напиши название', true); return; }
    var days = WDL.filter(function (w) { return d.days.indexOf(w) >= 0; });
    var maxO = S.habits.reduce(function (m, x) { return Math.max(m, num(x.order)); }, 0);
    var item = { id: d.id || ('h' + uid()), name: name, type: d.type || 'check', goal: d.type === 'count' ? Math.max(1, num(d.goal) || 1) : (d.type === 'food' ? (num(d.goal) || 3) : 1),
      unit: d.type === 'count' ? String(d.unit || '').trim() : (d.unit || ''), color: d.color, icon: d.icon, xp: num(d.xp) || 10, days: days.length === 7 ? '' : days.join(','), stat: d.stat, order: d.id ? d.order : maxO + 1, active: 'да' };
    if (!d.id) item.created = today();
    closeSheet(); act(function () { push({ op: 'habit.save', item: item }); });
  },
  hArch: function () {
    var id = UI.sheet.data.id; if (!id || !confirm('Убрать привычку? Очки за прошлые дни останутся.')) return;
    closeSheet(); act(function () { push({ op: 'habit.save', item: { id: id, active: 'нет', ended: today() } }); });
  },
  /* вес */
  wNew: function (el, e, date) {
    var D = date || today(), w = IX && IX.w[D];
    if (w) { A.wEdit({ dataset: { v: D } }); return; }
    openSheet('weight', { date: D, weight: '', fat: '', muscle: '', visceral: '', waist: '' });
  },
  wEdit: function (el) {
    var w = S.weights.filter(function (x) { return x.date === el.dataset.v; })[0]; if (!w) return;
    openSheet('weight', { orig: w.date, date: w.date, weight: w.weight, fat: w.fat, muscle: w.muscle, visceral: w.visceral, waist: w.waist, note: w.note });
  },
  saveW: function () {
    var d = UI.sheet.data, wt = num(d.weight);
    if (!(wt > 30 && wt < 400)) { toast('Проверь вес', true); return; }
    if (!isDate(d.date)) { toast('Проверь дату', true); return; }
    function opt(v) { return has(v) ? num(v) : ''; }
    var item = { date: d.date, weight: wt, fat: opt(d.fat), muscle: opt(d.muscle), visceral: opt(d.visceral), waist: opt(d.waist), note: d.note || '' };
    var orig = d.orig; closeSheet();
    act(function () {
      if (orig && orig !== item.date) push({ op: 'weight.delete', date: orig });
      push({ op: 'weight.save', item: item });
    });
  },
  delW: function () {
    var o = UI.sheet.data.orig; if (!o || !confirm('Удалить замер?')) return;
    closeSheet(); act(function () { push({ op: 'weight.delete', date: o }); });
  },
  fitR: function (el) { UI.fitRange = +el.dataset.v; render(); },
  more: function (el) { UI.more = el.dataset.v; render(); },
  /* настройки */
  sSex: function (el) { UI.sheet.data.sex = el.dataset.v; renderSheet(); },
  sAct: function (el) { UI.sheet.data.activity = +el.dataset.v; renderSheet(); },
  recalc: function () {
    var d = UI.sheet.data, ws = sortedWeights(), w = ws.length ? num(ws[ws.length - 1].weight) : num(d.startWeight);
    var hgt = num(d.height), age = num(d.age);
    if (!(w > 0 && hgt > 0 && age > 0)) { toast('Нужны вес, рост и возраст', true); return; }
    var bmr = 10 * w + 6.25 * hgt - 5 * age + (d.sex === 'ж' ? -161 : 5);
    var tdee = bmr * (num(d.activity) || 1.2);
    var kcal = Math.max(d.sex === 'ж' ? 1200 : 1500, Math.round((tdee - 650) / 50) * 50);
    var prot = Math.round((num(d.goalWeight) || w) * 1.6 / 5) * 5;
    var fat = Math.round(kcal * 0.3 / 9);
    d.kcal = kcal; d.protein = prot; d.fat = fat; d.carbs = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
    renderSheet(); toast('Расход ~' + fmt(Math.round(tdee / 10) * 10) + ' ккал → норма ' + fmt(kcal), true);
  },
  saveSet: function () {
    var d = UI.sheet.data, item = {};
    ['name', 'sex'].forEach(function (k) { item[k] = String(d[k] || '').trim(); });
    ['height', 'age', 'activity', 'startWeight', 'goalWeight', 'kcal', 'corridor', 'protein', 'fat', 'carbs'].forEach(function (k) { if (has(d[k])) item[k] = num(d[k]); });
    closeSheet(); act(function () { push({ op: 'settings.save', item: item }); });
  },
  saveConn: function () {
    var d = UI.sheet.data;
    conf = { url: String(d.url || '').trim(), key: String(d.key || '').trim() };
    LS.set('tr_conf', conf); closeSheet(); render(); sync(); toast('Подключение сохранено', true);
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var fn = A[el.dataset.a];
  if (fn) { if (el.dataset.a === 'closeModal') { fn(el, e); return; } e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!UI.sheet) return;
  if (el.dataset.f) { UI.sheet.data[el.dataset.f] = el.value; return; }
  if (el.dataset.in === 'fq') { UI.sheet.data.q = el.value; $('flist').innerHTML = prodList(el.value); }
  if (el.dataset.in === 'fg') { UI.sheet.data.grams = el.value; $('fres').innerHTML = gramsRes(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'fg') { e.preventDefault(); A.saveFood(); }
  if (e.key === 'Escape' && UI.sheet) closeSheet();
});
window.addEventListener('online', function () { scheduleSync(300); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); scheduleSync(300); } });
setInterval(function () { if (!document.hidden && Q.length) scheduleSync(100); }, 30000);
window.addEventListener('error', function (e) { toast('Ошибка: ' + (e.message || e), true); });

if (UI.tab === 'food') UI.foodDate = today();
render();
if (conf.url && conf.key) sync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
